name: Clôture automatique des appels d'offres expirés (14j)

on:
  schedule:
    # Tous les jours à 07h30 UTC (décalé de 30 min du cron décennale)
    - cron: '30 7 * * *'
  workflow_dispatch:

jobs:
  close-expired:
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher le cron de clôture des AO expirés
        run: |
          curl --fail --silent --show-error \
            -X GET "${{ secrets.CRON_BASE_URL }}/api/v1/cron/close-expired-tenders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nCode HTTP: %{http_code}\n"
