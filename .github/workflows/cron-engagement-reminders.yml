name: Relances J+30 / J+60 des avenants B2B sans déclaration

on:
  schedule:
    # Tous les jours à 08h00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  engagement-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher le cron des relances d'avenants
        run: |
          curl --fail --silent --show-error \
            -X GET "${{ secrets.CRON_BASE_URL }}/api/v1/cron/engagement-reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nCode HTTP: %{http_code}\n"
