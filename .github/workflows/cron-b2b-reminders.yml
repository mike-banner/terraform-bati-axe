name: Relances du flux B2B (choix, devis, confirmation)

on:
  schedule:
    # Tous les jours à 08h00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  b2b-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher le cron des relances B2B
        run: |
          curl --fail --silent --show-error \
            -X GET "${{ secrets.CRON_BASE_URL }}/api/v1/cron/b2b-reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nCode HTTP: %{http_code}\n"
